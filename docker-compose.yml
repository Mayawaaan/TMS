version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: tms-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: test $$(echo "rs.initiate().ok || rs.status().ok" | mongosh --quiet) -eq 1
      interval: 10s
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: tms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-core:
    build:
      context: .
      dockerfile: apps/api-core/Dockerfile
    container_name: tms-api-core
    ports:
      - "4000:4000"
    environment:
      - API_PORT=${API_PORT:-4000}
      - NODE_ENV=${NODE_ENV:-production}
      - WEB_ORIGIN=${WEB_ORIGIN:-http://localhost:5173}
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/tms_erp?replicaSet=rs0}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - DEV_GATE_SECRET=${DEV_GATE_SECRET}
      - GLOBAL_SECRET_PEPPER=${GLOBAL_SECRET_PEPPER}
      - AI_ENGINE_URL=${AI_ENGINE_URL:-http://ai-engine:8000}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-engine:
    build:
      context: ./apps/ai-engine
      dockerfile: Dockerfile
    container_name: tms-ai-engine
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/tms_erp?replicaSet=rs0
      - PORT=8000
    depends_on:
      mongo:
        condition: service_healthy

  web-portals:
    build:
      context: .
      dockerfile: apps/web-portals/Dockerfile
    container_name: tms-web-portals
    ports:
      - "80:80"
    depends_on:
      - api-core

volumes:
  mongo_data:
  redis_data:
